name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Python tests (matcher, extractor, digest, command line)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - run: npm ci
      - name: JavaScript tests (the page demo runs the same cases)
        run: npm test
      - name: Screenshots at 1440, 390 and 360 px
        run: npm run screenshots
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: error
